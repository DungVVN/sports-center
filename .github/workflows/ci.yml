name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  training-database:
    name: Training evidence database constraints
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sports_center_training_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d sports_center_training_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sports_center_training_test
      MIGRATE_DATABASE_URL: postgresql://ci:ci@localhost:5432/sports_center_training_test
      TRAINING_FOUNDATION_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/sports_center_training_test
      ASSIGNMENT_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/sports_center_training_test
      JOBS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test -- test/training-foundation.database.test.js test/personalization.database.test.js test/assignment.database.test.js

  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sports_center
      MIGRATE_DATABASE_URL: postgresql://ci:ci@localhost:5432/sports_center
      AUTH_JWT_SECRET: ci-only-auth-secret-that-is-at-least-32-characters
      VERIFICATION_CODE_SECRET: ci-only-verification-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:validate
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run worker:build

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: https://api.example.invalid/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
